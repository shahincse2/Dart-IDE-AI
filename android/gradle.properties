# Gradle JVM
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# CPU has 2 physical cores, so keep Gradle workers low
org.gradle.parallel=false
org.gradle.workers.max=2

# Keep daemon between builds
org.gradle.daemon=true
org.gradle.daemon.idletimeout=600000

# Build cache
org.gradle.caching=true
org.gradle.configureondemand=true

# AndroidX
android.useAndroidX=true

# Flutter template settings
android.newDsl=false
android.builtInKotlin=false




## JVM arguments for the Gradle daemon.
##
## Tuned for a low-RAM, low-core machine (4 GB total system RAM,
## 2-core CPU). The Flutter template default of -Xmx8G assumed a
## developer workstation with 16 GB+ of RAM; on this hardware that
## caused the Gradle daemon JVM to crash (see hs_err_pid*.log ?
## "Gradle build daemon disappeared unexpectedly").
##
## Sizes here:
##   -Xmx1536m            ? heap capped at 1.5 GB, leaving headroom
##                          for the OS, editor, and the Dart VM
##   -XX:MaxMetaspaceSize ? 512 MB (was 4 GB ? way too generous)
##   -XX:ReservedCodeCacheSize ? 256 MB (was 512 MB)
#org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
## Do not run Gradle tasks in parallel. On a 2-core machine, parallel
## workers fight over the same cores and exhaust the heap faster than
## they finish work ? serial is actually faster here, and far less
## likely to OOM.
#org.gradle.parallel=false
#org.gradle.workers.max=1
#
## Keep the daemon alive between builds (avoids paying JVM startup
## cost on every `flutter run`), but with a shorter idle timeout so
## the daemon doesn't sit on 1.5 GB of RAM for hours while you're
## editing code.
#org.gradle.daemon=true
#org.gradle.daemon.idletimeout=600000
#
## Build cache ? reuses outputs of unchanged tasks across builds.
## Cheap and helps a lot on repeated `flutter run` invocations.
#org.gradle.caching=true
#org.gradle.configureondemand=true
#
## AndroidX (required by modern Flutter plugins).
#android.useAndroidX=true
#
## This newDsl flag was added by the Flutter template.
#android.newDsl=false
#
## This builtInKotlin flag was added by the Flutter template.
#android.builtInKotlin=false

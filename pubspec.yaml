name: dartlab
description: >
  A complete mobile Dart IDE — write, run, and learn Dart entirely
  on an Android phone. No computer required.
publish_to: 'none'
version: 0.1.0+1

#environment:
#  sdk: '>=3.3.0 <4.0.0'
#  flutter: '>=3.19.0'
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  shared_preferences: ^2.2.3
  path_provider: ^2.1.5
  path: ^1.9.0

  # Dart execution engine (Phase 3). Runs inside a dedicated Isolate —
  # see services/dart_runner_service.dart for why.
  #tom_d4rt: ^1.77.0

  # UI Run mode (Phase 9): interprets a Dart script's top-level
  # `Widget build(BuildContext)` into a real, live Flutter widget tree.
  # This is tom_d4rt's own Flutter-facing companion package — NOT the
  # master doc's originally-suggested `flutter_d4rt`, which turned out
  # to be built on a different, unrelated interpreter engine. See
  # services/ui_runner_service.dart for the full reasoning.
  #
  # NOTE: verify this resolves cleanly against tom_d4rt ^1.29.0 above
  # when you run `flutter pub get` — tom_d4rt_flutter depends on a
  # specific tom_d4rt version internally, and that couldn't be checked
  # without pub.dev access in this environment. If `pub get` reports a
  # version conflict, the fix is adjusting the tom_d4rt constraint
  # above to whatever tom_d4rt_flutter actually requires.
  #tom_d4rt_flutter: ^1.2.0

#  tom_d4rt: ^1.224.0 # অথবা সর্বশেষ ভার্সন
#  tom_d4rt_flutter: ^1.2.0
  tom_d4rt: ^1.77.0
  tom_d4rt_flutter:
    path: ../packages/tom_d4rt_flutter
  share_plus: ^13.3.0
  file_picker: ^13.1.0
  open_filex: ^4.7.0
  cross_file: ^0.3.4
  printing: ^5.14.2
  pdf: ^3.11.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # NOTE: The editor needs a monospace font for correct character
  # alignment (line numbers, indentation). We're using the platform's
  # built-in monospace family (GoogleFonts.mono / Courier fallback) for
  # now — see utils/themes.dart. A bundled offline font (e.g. JetBrains
  # Mono) can be dropped into assets/fonts/ later; do not reference an
  # asset here until the actual .ttf file exists in this repo.
